# This workflow will install dependencies, create coverage tests
# and run Pytest with coverage reporting
name: Pytest and coverage

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"

jobs:
  tests_and_coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run tests with coverage
        run: |
          set -o pipefail
          pytest --cache-clear --cov --cov-report=term-missing:skip-covered --junitxml=pytest.xml tests/ | tee pytest-coverage.txt
      - name: Pytest coverage comment
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: MishaKav/pytest-coverage-comment@v1
        with:
          github-token: ${{ secrets.actions_token }}
          pytest-coverage-path: ./pytest-coverage.txt
          junitxml-path: ./pytest.xml

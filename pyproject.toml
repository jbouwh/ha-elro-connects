[tool.ruff]
target-version = "py314"
required-version = ">=0.16.0"

[tool.ruff.lint]
select = [
    "A001", # Variable {name} is shadowing a Python builtin
    "ASYNC", # flake8-async
    "B", # flake8-bugbear
    "BLE", # flake8-blind-except
    "C4", # flake8-comprehensions
    "D", # pydocstyle
    "E", # pycodestyle errors
    "F", # pyflakes
    "FLY", # flynt
    "G", # flake8-logging-format
    "I", # isort
    "INP", # flake8-no-pep420
    "LOG", # flake8-logging
    "N", # pep8-naming
    "PERF", # Perflint
    "PGH", # pygrep-hooks
    "PIE", # flake8-pie
    "PL", # pylint
    "PT", # flake8-pytest-style
    "RET", # flake8-return
    "RSE", # flake8-raise
    "RUF", # ruff specific
    "S", # flake8-bandit
    "SIM", # flake8-simplify
    "SLOT", # flake8-slots
    "T20", # flake8-print
    "TID", # flake8-tidy-imports
    "TRY", # tryceratops
    "UP", # pyupgrade
    "W", # pycodestyle warnings
]
ignore = [
    "D202", # No blank lines allowed after function docstring
    "D203", # 1 blank line required before class docstring
    "D212", # Multi-line docstring summary should start at the first line
    "D213", # Multi-line docstring summary should start at the second line
    "D406", # Section name should end with a newline
    "D407", # Section name underlining
    "E501", # line too long, handled by the formatter
    "E731", # do not assign a lambda expression, use a def
    "N818", # Exception name should be named with an Error suffix (CannotConnect is HA convention)
    "PLC0415", # `import` should be at the top-level of a file
    "PLC1901", # Comparison to empty string, too opinionated
    "PLR0911", # Too many return statements
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments
    "PLR0915", # Too many statements
    "PLR0917", # Too many positional arguments
    "PLR2004", # Magic value used in comparison
    "PT011", # pytest.raises too broad
    "PT018", # Assertion should be broken down into multiple parts
    "RUF012", # Mutable class attributes should be annotated with typing.ClassVar
    "S101", # Use of assert detected, used in tests
    "SIM103", # Return the condition directly, can be less readable
    "SIM108", # Use ternary operator, can be less readable
    "TRY003", # Avoid specifying long messages outside the exception class
    "TRY400", # Use `logging.exception` instead of `logging.error`
    # Conflicts with the formatter
    "ISC001",
    "W191",
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = [
    "custom_components",
    "tests",
]
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"script/*" = [
    "INP001", # scripts are not part of a package
]
"tests/**" = [
    "D", # docstrings are not required in tests
    "INP001", # tests/elro_connects has no __init__.py
    "S", # bandit checks do not apply to test code
]

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
pythonpath = ["custom_components"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

norecursedirs = [
    ".git",
    "testing_config",
]
log_format = "%(asctime)s.%(msecs)03d %(levelname)-8s %(threadName)s %(name)s:%(filename)s:%(lineno)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"

[tool.coverage.run]
source = ["custom_components"]

[tool.coverage.report]
fail_under = 99
show_missing = true

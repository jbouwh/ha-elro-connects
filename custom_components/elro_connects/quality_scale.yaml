rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration does not register custom actions.
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: The integration does not register custom actions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup:
    status: exempt
    comment: Entities do not subscribe to events.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: |
      The connection is local. Cloud credentials are only used once during setup
      to obtain the connector ID and API key.
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: The integration does not support discovery.
  discovery:
    status: exempt
    comment: |
      The K1 connector only announces itself with the generic Espressif DHCP
      hostname (ESP-xxxxxx) and an Espressif MAC address, which are shared by
      many other devices. It cannot be discovered reliably.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices: done
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: There are no repairable issues.
  stale-devices:
    status: exempt
    comment: |
      The K1 connector sends each device in a separate UDP message, so a device
      can be missing from a single update. To avoid removing devices that are
      still there, stale devices are not removed automatically. A device that
      is no longer reported by the connector can be deleted from the UI.

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: done
